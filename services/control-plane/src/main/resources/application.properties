server.address=127.0.0.1

# 运行目录和 Claude Code 可执行文件必须由部署环境显式提供。
code-weave.run.concurrency=1
code-weave.run.queue-capacity=10

# Java/Python must share the same local roots and internal credential.
code-weave.review.internal-bearer-token=${CODE_WEAVE_REVIEW_INTERNAL_BEARER_TOKEN:}
code-weave.review.harness-base-url=${CODE_WEAVE_REVIEW_HARNESS_BASE_URL:http://127.0.0.1:8091}
code-weave.review.snapshot-root=${CODE_WEAVE_REVIEW_SNAPSHOT_ROOT:${code-weave.runtime-root}/review-snapshots}
code-weave.review.execution-root=${CODE_WEAVE_REVIEW_EXECUTION_ROOT:${code-weave.runtime-root}/review-workspaces}
